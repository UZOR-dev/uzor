[package]
name = "uzor-window-mobile"
authors.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Thin mobile layer over uzor-framework: app entry for iOS and Android, lifecycle, safe-area and keyboard insets from the native wrapper, haptics, and Swift / Kotlin host templates"
readme = "README.md"

[features]
default = []
# Android activity glue (pick one; GameActivity is the one with real text input).
android-game-activity = ["uzor-framework/android-game-activity"]
android-native-activity = ["uzor-framework/android-native-activity"]
# Every render backend instead of the lean phone set (vello-gpu + tiny-skia).
all-backends = ["uzor-framework/native"]

[dependencies]
uzor-framework = { workspace = true, features = ["native-lean"] }
log = "0.4"

[dev-dependencies]
uzor = { workspace = true, features = ["flow-flex", "flow-grid"] }
