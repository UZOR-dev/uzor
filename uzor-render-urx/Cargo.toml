[package]
name        = "uzor-render-urx"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "URX render adapter — implements uzor::RenderContext, emits urx_core::Scene. Lets uzor/tessera consumers select any of the 4 URX 2D backends (cpu/wgpu/hybrid/wgpu-full) through the standard backend-selection path. Phase A bridge — Phase B will let consumers emit Scene directly."
keywords    = ["graphics", "rendering", "urx", "adapter", "uzor"]
categories  = ["graphics", "rendering"]

[dependencies]
uzor          = { workspace = true, features = ["shaper"] }
uzor-urx-core = { workspace = true }
uzor-urx-glyph = { workspace = true }
uzor-urx-image = { workspace = true }
kurbo         = "0.13"
peniko        = "0.6"
metrics       = "0.24"

[dev-dependencies]
# End-to-end CJK text test: the CPU rasteriser + the opt-in CJK face
# (feature unification loads it into the shaper's font database too).
uzor-urx-cpu = { workspace = true, features = ["glyph"] }
uzor-fonts   = { workspace = true, features = ["cjk"] }
# Per-primitive raster comparison against the legacy CPU adapter
# (us kit/legacy primitive unify diagnostics).
uzor-render-tiny-skia = { workspace = true }
