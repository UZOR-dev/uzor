[package]
name = "uzor-framework"
authors.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
# Golden-image tests read PNGs from the repo (and a sibling crate); keep them out of the upload.
exclude = ["tests/"]
keywords.workspace = true
categories.workspace = true
description = "uzor app engine: one kernel of single-writer engines driven by a typed input bus"
readme = "../README.md"

[dependencies]
# Leaf types only (Rect, WidgetId, KeyCode, docking ids, tokens, cadence types).
# `default-features = false` is the workspace default; no uzor feature is
# needed by `types/` (uzor's serde derives are unconditional).
uzor = { workspace = true, features = ["testing"] }
uzor-framework-macros = { workspace = true }
serde = { workspace = true }
# The handle's lock-free snapshot slot (SWC: channels + Arc only at the handle).
arc-swap = "1.7"
# Layout blob wire format (versioned envelope, §3.2.5); feature `layout-blob`.
postcard = { version = "1", default-features = false, features = ["alloc"], optional = true }
smallvec = "1.10"
thiserror = "1.0"

# Native host (feature `native`) — F9.
winit = { version = "0.30", optional = true }
uzor-window-desktop = { workspace = true, optional = true }
uzor-render-hub = { workspace = true, optional = true }
png = { version = "0.17", optional = true }
# Offscreen screenshots for feature `automation`.
uzor-render-tiny-skia = { workspace = true, optional = true }
log = { version = "0.4", optional = true }
# `SubmitParams::base_color` type (same as hub).
color = { version = "0.3", optional = true }
# Screenshot GPU readback uses vello's RenderSurface + wgpu.
vello = { version = "0.9", optional = true }

# Web host (feature `web`) — F10. Paint is canvas2d: uzor-render-hub does
# not build for wasm32 (see host/native/mod.rs).
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }
web-sys = { version = "0.3", optional = true, features = [
    "AddEventListenerOptions",
    "Blob",
    "CanvasRenderingContext2d",
    "Clipboard",
    "ClipboardEvent",
    "CompositionEvent",
    "CssStyleDeclaration",
    "DataTransfer",
    "Document",
    "DomRect",
    "DragEvent",
    "Element",
    "Event",
    "EventTarget",
    "File",
    "FileList",
    "FileReader",
    "HtmlCanvasElement",
    "HtmlElement",
    "KeyboardEvent",
    "Location",
    "MediaQueryList",
    "MouseEvent",
    "Navigator",
    "Performance",
    "ResizeObserver",
    "ResizeObserverEntry",
    "Touch",
    "TouchEvent",
    "TouchList",
    "VisibilityState",
    "WheelEvent",
    "Window",
] }
uzor-render-canvas2d = { workspace = true, optional = true }
uzor-window-web = { workspace = true, optional = true }
# Observe monitor example, and the dev-control RPC (feature `dev-control`).
serde_json = { version = "1", optional = true }
# Dev control (feature `dev-control`): screenshots as base64 in the RPC.
base64 = { version = "0.22", optional = true }

# Dev control transport (feature `dev-control`): loopback HTTP, token, discovery
# file. Native only; uzor-devtools does not depend on the framework.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
uzor-devtools = { workspace = true, optional = true }

[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
arboard = { version = "3", optional = true }
tray-icon = { version = ">=0.19,<0.21", optional = true }

# macOS dock tile (tray widgets): winit's own objc2 crates.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.5", optional = true }
objc2-foundation = { version = "0.2", optional = true, features = ["NSData", "NSThread"] }
objc2-app-kit = { version = "0.2", optional = true, features = ["NSApplication", "NSResponder", "NSImage"] }

# Linux tray: the StatusNotifier item runs a GTK loop on its own thread (tray-icon's
# own GTK, no new crate).
[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", optional = true }

[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android")), not(target_arch = "wasm32")))'.dependencies]
# XFlush after a software present (softbuffer queues the X11 PutImage and its
# completion probe without flushing: the last frame stayed unseen until the
# next input event).
x11-dl = { version = "2.21", optional = true }

[features]
default = ["layout-blob", "chrome"]
# Paint the window chrome strip (title, tabs, window buttons) with uzor's chrome composite.
# Apps that hide the strip (`LayoutCmd::SetChrome { visible: false, .. }`) or draw their own
# controls can drop it, and the chrome composite with its token theme leave the binary; a
# shown strip is then one drag band.
chrome = []
# Dock layout save/restore (`LayoutCmd::RequestBlob` / `Restore`, postcard codec). Without it
# both commands answer with their failure intent; apps that never persist a layout can drop it.
layout-blob = ["dep:postcard"]
# DevTools-like F12 overlay over every registered widget (debug builds only).
inspector = ["uzor/inspector"]
# Web: mirror the accessibility tree into hidden ARIA DOM nodes after each frame.
a11y-dom = ["web"]
# Native (winit) host — brief F9 — with every render backend of the hub
# (vello GPU / hybrid / CPU, wgpu-instanced, tiny-skia, URX 2D and 3D).
native = ["native-lean", "uzor-render-hub/default"]
# The native host with the two backends a phone needs: vello on the GPU
# (Metal / Vulkan) and tiny-skia on the CPU when there is no compute-capable GPU
# (GLES-only Android). The mobile features below build on this one; add
# `native` for the full backend set.
native-lean = [
    "native-core",
    "uzor-render-hub/vello-gpu",
    "uzor-render-hub/tiny-skia",
]
# The host without any render backend chosen (pick them on uzor-render-hub).
native-core = [
    "dep:winit",
    "dep:x11-dl",
    "dep:uzor-window-desktop",
    "dep:uzor-render-hub",
    "dep:arboard",
    "dep:tray-icon",
    "dep:gtk",
    "dep:objc2",
    "dep:objc2-foundation",
    "dep:objc2-app-kit",
    "dep:uzor-render-tiny-skia",
    "dep:png",
    "dep:log",
    "dep:color",
    "dep:vello",
]
# Android: winit needs one activity glue. Pick one; the app's `android_main` passes
# its `AndroidApp` in `NativeOptions::android_app`.
android-native-activity = ["native-lean", "winit/android-native-activity"]
android-game-activity = ["native-lean", "winit/android-game-activity"]
# Web (browser RAF) host — brief F10. Canvas2d paint, not the render hub.
web = [
    "dep:wasm-bindgen",
    "dep:js-sys",
    "dep:web-sys",
    "dep:uzor-render-canvas2d",
    "dep:uzor-window-web",
    "dep:log",
]
# Automation port (`automation`): a tool drives the app through the
# accessibility tree, injected input and screenshots. Off by default; a build
# without it carries none of that code.
automation = ["dep:uzor-render-tiny-skia", "dep:png"]
# Dev control: the one switch a builder turns on (`features = ["dev-control"]`).
# The native host then serves `NativeOptions::dev_control` on loopback (see
# `dev_control`); the RPC core, uzor-devtools and the automation port come with
# it. Without it none of that is compiled. Native only (on wasm it is inert).
dev-control = ["automation", "dep:uzor-devtools", "dep:serde_json", "dep:base64"]
# HQ observe monitor (`examples/monitor`). Not part of the framework surface.
monitor = ["web", "dep:serde_json"]

[dev-dependencies]
# CPU context for goldens. F8 compares against the committed
# uzor-render-tiny-skia widget PNGs. F11 stores its own synthetic
# renders under tests/goldens/demo (not photographs).
uzor-render-tiny-skia = { workspace = true }
tiny-skia = "0.11"
# The examples build their pages with `kit::dom`: flex and grid boxes need the
# `ui::flow` layouts (without them they lay out as blocks).
uzor = { workspace = true, features = ["testing", "flow-flex", "flow-grid"] }

# Pixel goldens of the demo window, chrome strip included.
[[test]]
name = "dev_control"
required-features = ["dev-control"]

[[test]]
name = "f11_demo"
required-features = ["chrome"]

[[example]]
name = "native_two_windows"
required-features = ["native"]

[[example]]
name = "demo_native"
path = "examples/demo/main_native.rs"
required-features = ["native"]

[[example]]
name = "demo_web"
path = "examples/demo/main_web.rs"
required-features = ["web"]
crate-type = ["cdylib"]

[[example]]
name = "monitor_web"
path = "examples/monitor/main_web.rs"
required-features = ["monitor"]
crate-type = ["cdylib"]

[[example]]
name = "dom_scroll"
required-features = ["native"]

[[example]]
name = "image_viewer"
required-features = ["native"]
