[package]
name = "uzor-framework"
authors.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
# Golden-image tests read PNGs from the repo (and a sibling crate); keep them out of the upload.
exclude = ["tests/"]
keywords.workspace = true
categories.workspace = true
description = "uzor app engine: one kernel of single-writer engines driven by a typed input bus"
readme = "../README.md"

[dependencies]
# Leaf types only (Rect, WidgetId, KeyCode, docking ids, tokens, cadence types).
# `default-features = false` is the workspace default; no uzor feature is
# needed by `types/` (uzor's serde derives are unconditional).
uzor = { workspace = true, features = ["testing"] }
uzor-framework-macros = { workspace = true }
serde = { workspace = true }
# The handle's lock-free snapshot slot (SWC: channels + Arc only at the handle).
arc-swap = "1.7"
# Layout blob wire format (versioned envelope, §3.2.5); feature `layout-blob`.
postcard = { version = "1", default-features = false, features = ["alloc"], optional = true }
smallvec = "1.10"
thiserror = "1.0"

# Native host (feature `native`) — F9.
winit = { version = "0.30", optional = true }
uzor-window-desktop = { workspace = true, optional = true }
uzor-render-hub = { workspace = true, optional = true }
arboard = { version = "3", optional = true }
tray-icon = { version = ">=0.19,<0.21", optional = true }
png = { version = "0.17", optional = true }
log = { version = "0.4", optional = true }
# `SubmitParams::base_color` type (same as hub).
color = { version = "0.3", optional = true }
# Screenshot GPU readback uses vello's RenderSurface + wgpu.
vello = { version = "0.9", optional = true }

# Web host (feature `web`) — F10. Paint is canvas2d: uzor-render-hub does
# not build for wasm32 (see host/native/mod.rs).
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }
web-sys = { version = "0.3", optional = true, features = [
    "AddEventListenerOptions",
    "Blob",
    "CanvasRenderingContext2d",
    "Clipboard",
    "ClipboardEvent",
    "CompositionEvent",
    "CssStyleDeclaration",
    "DataTransfer",
    "Document",
    "DomRect",
    "DragEvent",
    "Element",
    "Event",
    "EventTarget",
    "File",
    "FileList",
    "FileReader",
    "HtmlCanvasElement",
    "HtmlElement",
    "KeyboardEvent",
    "MediaQueryList",
    "MouseEvent",
    "Navigator",
    "Performance",
    "ResizeObserver",
    "ResizeObserverEntry",
    "Touch",
    "TouchEvent",
    "TouchList",
    "VisibilityState",
    "WheelEvent",
    "Window",
] }
uzor-render-canvas2d = { workspace = true, optional = true }
uzor-window-web = { workspace = true, optional = true }

[target.'cfg(all(unix, not(target_os = "macos"), not(target_arch = "wasm32")))'.dependencies]
# XFlush after a software present (softbuffer queues the X11 PutImage and its
# completion probe without flushing: the last frame stayed unseen until the
# next input event).
x11-dl = { version = "2.21", optional = true }

[features]
default = ["layout-blob", "chrome"]
# Paint the window chrome strip (title, tabs, window buttons) with uzor's chrome composite.
# Apps that hide the strip (`LayoutCmd::SetChrome { visible: false, .. }`) or draw their own
# controls can drop it, and the chrome composite with its token theme leave the binary; a
# shown strip is then one drag band.
chrome = []
# Dock layout save/restore (`LayoutCmd::RequestBlob` / `Restore`, postcard codec). Without it
# both commands answer with their failure intent; apps that never persist a layout can drop it.
layout-blob = ["dep:postcard"]
# DevTools-like F12 overlay over every registered widget (debug builds only).
inspector = ["uzor/inspector"]
# Web: mirror the accessibility tree into hidden ARIA DOM nodes after each frame.
a11y-dom = ["web"]
# Native (winit) host — brief F9.
native = [
    "dep:winit",
    "dep:x11-dl",
    "dep:uzor-window-desktop",
    "dep:uzor-render-hub",
    "dep:arboard",
    "dep:tray-icon",
    "dep:png",
    "dep:log",
    "dep:color",
    "dep:vello",
]
# Web (browser RAF) host — brief F10. Canvas2d paint, not the render hub.
web = [
    "dep:wasm-bindgen",
    "dep:js-sys",
    "dep:web-sys",
    "dep:uzor-render-canvas2d",
    "dep:uzor-window-web",
    "dep:log",
]

[dev-dependencies]
# CPU context for goldens. F8 compares against the committed
# uzor-render-tiny-skia widget PNGs. F11 stores its own synthetic
# renders under tests/goldens/demo (not photographs).
uzor-render-tiny-skia = { workspace = true }
tiny-skia = "0.11"

# Pixel goldens of the demo window, chrome strip included.
[[test]]
name = "f11_demo"
required-features = ["chrome"]

[[example]]
name = "native_two_windows"
required-features = ["native"]

[[example]]
name = "demo_native"
path = "examples/demo/main_native.rs"
required-features = ["native"]

[[example]]
name = "demo_web"
path = "examples/demo/main_web.rs"
required-features = ["web"]
crate-type = ["cdylib"]

[[example]]
name = "image_viewer"
required-features = ["native"]
