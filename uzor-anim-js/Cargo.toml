[package]
name = "uzor-anim-js"
authors.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Run canvas-style JS animations through uzor: page engine on web, embedded QuickJS on native"
readme = "../README.md"

[dependencies]
uzor = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rquickjs = { version = "0.10", default-features = false, optional = true }

[features]
# Embedded QuickJS engine for native targets (~0.7 MB stripped). Without it
# `JsAnimHost::new` returns `AnimScriptError::Unavailable` on native.
quickjs = ["dep:rquickjs"]

[dev-dependencies]
uzor-render-tiny-skia = { workspace = true }
tiny-skia = "0.11"
