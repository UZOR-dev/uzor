[package]
name = "uzor-anim-js"
authors.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Run canvas-style JS animations through uzor: page engine on web, embedded QuickJS on native"
readme = "../README.md"

[dependencies]
uzor = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Library name stays `rquickjs`. `compiler` is on the runtime crate; without
# it the engine is still the interpreter. Pins are exact: the JIT ABI rejects
# a mix of 0.14.x crates. Decision: docs/uzor/audits/quickjs-jit-0.14.1-2026-10-26.md
rquickjs = { package = "quickjs-jit", version = "=0.14.1", default-features = false, features = ["std", "jit-abi", "loader"], optional = true }
rquickjs-jit = { package = "quickjs-jit-runtime", version = "=0.14.1", features = ["compiler"], optional = true }

[features]
# Embedded QuickJS JIT for native targets. Without it `JsAnimHost::new`
# returns `AnimScriptError::Unavailable` on native.
quickjs = ["dep:rquickjs", "dep:rquickjs-jit"]

[dev-dependencies]
uzor-render-tiny-skia = { workspace = true }
tiny-skia = "0.11"
